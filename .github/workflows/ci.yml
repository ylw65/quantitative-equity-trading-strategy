name: Research checks
on: [push, pull_request]
jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: environment-lock.txt
      - run: python -m pip install -r environment-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q
  cleaning:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: data_pipeline/environment-lock.txt
      - run: python -m pip install -r environment-lock.txt
      - run: python -m pip check
      - run: python -m pytest -q -p no:cacheprovider
